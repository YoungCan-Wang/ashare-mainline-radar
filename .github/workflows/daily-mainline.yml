name: Daily A-share Mainline Radar

concurrency:
  group: daily-mainline-${{ github.repository }}
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Scan mode"
        required: false
        default: "universe"
        type: choice
        options:
          - curated
          - universe
      max_symbols:
        description: "0 means uncapped. Use a positive number for lighter scheduled runs."
        required: false
        default: "0"
      force:
        description: "Run even if a successful report already exists for today"
        required: false
        default: false
        type: boolean
      notify_feishu:
        description: "Send the Feishu card after generating the report"
        required: false
        default: true
        type: boolean
  schedule:
    # 16:45 Beijing time on weekdays, after A-share close.
    - cron: "45 8 * * 1-5"

jobs:
  radar:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.frequency.outputs.should_run }}
    permissions:
      contents: read
      actions: read
    env:
      TICKFLOW_API_KEY: ${{ secrets.TICKFLOW_API_KEY }}
      TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
      FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
      DASHBOARD_PUBLIC_URL: ${{ vars.DASHBOARD_PUBLIC_URL || 'https://ashare-mainline-radar-dashboard.vercel.app' }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
      RADAR_INGEST_KEY: ${{ secrets.RADAR_INGEST_KEY }}
      RADAR_STORAGE_BACKEND: auto
      MAINLINE_RADAR_MODE: ${{ inputs.mode || 'universe' }}
      MAINLINE_MAX_SYMBOLS: ${{ inputs.max_symbols || '0' }}
      NOTIFY_FEISHU: ${{ github.event_name == 'schedule' || inputs.notify_feishu }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Check daily frequency
        id: frequency
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python scripts/check_workflow_frequency.py
          --workflow daily-mainline.yml
          --policy daily
          --force "${{ inputs.force || 'false' }}"
      - name: Install package
        if: steps.frequency.outputs.should_run == 'true'
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        if: steps.frequency.outputs.should_run == 'true'
        run: python -m pytest
      - name: Build dashboard application
        if: steps.frequency.outputs.should_run == 'true'
        run: |
          npm ci --prefix dashboard
          npm run lint --prefix dashboard
          npm run build --prefix dashboard
      - name: Generate radar report
        if: steps.frequency.outputs.should_run == 'true'
        run: |
          args=(--output-dir reports/latest)
          if [[ "$NOTIFY_FEISHU" == "true" ]]; then
            args+=(--send-feishu)
          fi
          python scripts/run_daily.py "${args[@]}"
      - name: Build dashboard
        if: steps.frequency.outputs.should_run == 'true'
        run: python scripts/build_dashboard.py --bundle reports/latest/storage_bundle.json --output-dir reports/latest/dashboard --source-dir dashboard/dist
      - name: Upload report
        if: steps.frequency.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ashare-mainline-radar
          path: reports/latest
          retention-days: 90

  deploy:
    needs: radar
    if: needs.radar.outputs.should_run == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - name: Download dashboard artifact
        uses: actions/download-artifact@v4
        with:
          name: ashare-mainline-radar
          path: reports/latest
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Deploy dashboard to Vercel
        run: >-
          npx --yes vercel@56.3.1 deploy reports/latest/dashboard
          --prod --yes --token "$VERCEL_TOKEN"
