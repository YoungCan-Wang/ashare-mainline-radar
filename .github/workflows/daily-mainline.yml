name: Daily A-share Mainline Radar

concurrency:
  group: tickflow-api-${{ github.repository }}
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Scan mode"
        required: false
        default: "universe"
        type: choice
        options:
          - curated
          - universe
      max_symbols:
        description: "0 means uncapped. Use a positive number for lighter scheduled runs."
        required: false
        default: "0"
      force:
        description: "Run even if a successful report already exists for today"
        required: false
        default: false
        type: boolean
  schedule:
    # 16:45 Beijing time on weekdays, after A-share close.
    - cron: "45 8 * * 1-5"

jobs:
  radar:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    env:
      TICKFLOW_API_KEY: ${{ secrets.TICKFLOW_API_KEY }}
      TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
      FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      RADAR_STORAGE_BACKEND: auto
      MAINLINE_RADAR_MODE: ${{ inputs.mode || 'universe' }}
      MAINLINE_MAX_SYMBOLS: ${{ inputs.max_symbols || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check daily frequency
        id: frequency
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python scripts/check_workflow_frequency.py
          --workflow daily-mainline.yml
          --policy daily
          --force "${{ inputs.force || 'false' }}"
      - name: Install package
        if: steps.frequency.outputs.should_run == 'true'
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        if: steps.frequency.outputs.should_run == 'true'
        run: python -m pytest
      - name: Generate radar report
        if: steps.frequency.outputs.should_run == 'true'
        run: python scripts/run_daily.py --output-dir reports/latest --send-feishu
      - name: Upload report
        if: steps.frequency.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ashare-mainline-radar
          path: reports/latest
          retention-days: 90
