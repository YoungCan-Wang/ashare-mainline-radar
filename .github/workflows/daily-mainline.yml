name: Daily A-share Mainline Radar

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Scan mode"
        required: false
        default: "universe"
        type: choice
        options:
          - curated
          - universe
      max_symbols:
        description: "0 means uncapped. Use a positive number for lighter scheduled runs."
        required: false
        default: "0"
  schedule:
    # 16:45 Beijing time on weekdays, after A-share close.
    - cron: "45 8 * * 1-5"

jobs:
  radar:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TICKFLOW_API_KEY: ${{ secrets.TICKFLOW_API_KEY }}
      TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
      FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
      MAINLINE_RADAR_MODE: ${{ inputs.mode || 'universe' }}
      MAINLINE_MAX_SYMBOLS: ${{ inputs.max_symbols || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest
      - name: Generate radar report
        run: python scripts/run_daily.py --output-dir reports/latest --send-feishu
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: ashare-mainline-radar
          path: reports/latest
