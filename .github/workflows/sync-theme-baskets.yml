name: Sync theme baskets

# Theme baskets are scoring config, not runtime market data.
# Refresh weekly (or manually). When quality gates pass and the file changed,
# commit configs/theme_baskets.json directly to main. When gates fail, skip:
# no commit, no branch, no pull request.
# Do not fold this into daily-mainline: East Money flakiness must not block the radar.
# Schedule never opens a PR. GitHub Actions in this org cannot create PRs
# (createPullRequest is denied), which is why the old open-PR step failed.

on:
  workflow_dispatch:
    inputs:
      offline:
        description: "Use seed symbols only; skip East Money HTTP. Quality gates refuse to commit this run."
        required: false
        default: false
        type: boolean
  schedule:
    # Sunday 20:00 Beijing time — prep for the next trading week.
    - cron: "0 12 * * 0"

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      OFFLINE: ${{ github.event_name == 'workflow_dispatch' && inputs.offline || false }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install -e .
      - name: Sync curated theme presets
        id: sync
        run: |
          set -euo pipefail
          as_of="$(TZ=Asia/Shanghai date +%F)"
          args=(--all-presets --write --as-of "$as_of" --enforce-quality-gates)
          if [[ "$OFFLINE" == "true" ]]; then
            args+=(--offline)
          fi
          mkdir -p reports
          python scripts/sync_theme_concepts.py "${args[@]}" | tee reports/sync-theme-baskets.log
          if grep -q '^QUALITY gate=skip' reports/sync-theme-baskets.log || ! grep -q '^QUALITY gate=pass' reports/sync-theme-baskets.log; then
            git checkout -- configs/theme_baskets.json
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            echo "::warning title=theme basket quality gate::Quality gates did not pass; left main untouched"
            grep '^QUALITY ' reports/sync-theme-baskets.log || true
            exit 0
          fi
          if git diff --quiet -- configs/theme_baskets.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "theme_baskets.json unchanged"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git --no-pager diff --stat -- configs/theme_baskets.json
            git --no-pager diff -- configs/theme_baskets.json > reports/theme-baskets.diff
            cp configs/theme_baskets.json reports/theme_baskets.json
          fi
      - name: Upload sync artifact
        if: steps.sync.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: theme-baskets-sync
          path: |
            reports/theme-baskets.diff
            reports/theme_baskets.json
            reports/sync-theme-baskets.log
          retention-days: 30
      - name: Commit theme baskets to main
        if: steps.sync.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- configs/theme_baskets.json
          git commit -m "chore: refresh curated theme baskets from East Money" \
            -m "Weekly liquidity/constituent sync for preset mainlines. Quality gates passed, so this commits directly to main and does not open a pull request."
          # contents:write lets GITHUB_TOKEN push. If a ruleset blocks Actions on
          # the default branch, this push fails and main stays untouched.
          if ! git push origin HEAD:main; then
            echo "Push to main was rejected. Retrying once after rebase onto origin/main."
            echo "If the error is a permission or ruleset denial, allow the Actions GITHUB_TOKEN to push to the default branch. This job does not open a pull request."
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
