name: PR checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch PR base
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags origin "${{ github.base_ref }}" --depth=1
      - name: Fetch main
        if: github.event_name != 'pull_request'
        run: git fetch --no-tags origin main --depth=1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest
      - name: Block SQL commits and verify live DDL
        env:
          DDL_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'origin/main' }}
        run: python scripts/check_pr_ddl.py --base "$DDL_BASE" --head HEAD
