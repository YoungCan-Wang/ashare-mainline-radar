name: A-share Mainline Strategy Backtest

concurrency:
  group: tickflow-api-${{ github.repository }}
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      count:
        description: "Daily bars per symbol"
        required: false
        default: "1800"
      breadth_symbols:
        description: "Deterministic A-share sample used for historical market breadth"
        required: false
        default: "600"
      force:
        description: "Run even if this commit completed a backtest in the last 24 hours"
        required: false
        default: false
        type: boolean

jobs:
  backtest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    env:
      TICKFLOW_API_KEY: ${{ secrets.TICKFLOW_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check backtest frequency
        id: frequency
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python scripts/check_workflow_frequency.py
          --workflow strategy-backtest.yml
          --policy backtest
          --min-hours 24
          --force "${{ inputs.force || 'false' }}"
      - name: Install package
        if: steps.frequency.outputs.should_run == 'true'
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        if: steps.frequency.outputs.should_run == 'true'
        run: python -m pytest
      - name: Run point-in-time strategy backtest
        if: steps.frequency.outputs.should_run == 'true'
        run: >-
          python scripts/run_strategy_backtest.py
          --count "${{ inputs.count || '1800' }}"
          --breadth-symbols "${{ inputs.breadth_symbols || '600' }}"
          --output reports/backtest/strategy_backtest.json
      - name: Upload backtest
        if: steps.frequency.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ashare-mainline-strategy-backtest
          path: reports/backtest
          retention-days: 90
