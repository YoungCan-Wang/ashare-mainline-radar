[project]
name = "ashare-mainline-radar"
version = "0.1.0"
requires-python = ">=3.9"
description = "A-share market mainline radar powered by TickFlow market data and pluggable intelligence sources"
readme = "README.md"
license = "MIT"
authors = [{ name = "YoungCan Wang" }]
keywords = ["a-share", "market", "mainline", "tickflow", "radar", "quant"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4.0"]

[project.scripts]
mainline-radar = "ashare_mainline_radar.cli:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ashare_mainline_radar*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py39"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]
